# Deploy on Render (same pattern as intern / TRace)
# 1. Go to https://dashboard.render.com/blueprints/new
#    → connect https://github.com/Kinoti-mitchell/safarihub
# 2. Render creates the web service from this file
# 3. Fill secrets marked sync: false (copy from local .env)
# 4. After first deploy, set NEXT_PUBLIC_APP_URL and AUTH_URL to:
#    https://safari-hub.onrender.com  (or your actual Render URL)

services:
  - type: web
    name: safari-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start-render.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      # Ensure next build can resolve Tailwind even if NODE_ENV=production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_APP_URL
        # Set after first deploy, e.g. https://safari-hub.onrender.com
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        # Same as NEXT_PUBLIC_APP_URL once known
        sync: false
      - key: DATABASE_URL
        # Supabase pooler URI (port 6543)
        sync: false
      - key: DIRECT_URL
        # Supabase session URI (port 5432)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
